[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # NOTE: the Netlify OOM (exit 137) was NOT a V8 heap problem — it was
  # Tailwind v4's automatic content detection scanning large binary assets in
  # public/ (4.7MB GLB models, etc.) as text, ballooning the build to ~14GB
  # RSS. The real fix lives in src/styles/global.css, which scopes Tailwind's
  # source detection to source files only. With that, peak build RSS is ~1.3GB.
