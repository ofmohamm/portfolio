[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node to a stable LTS. Netlify's default build image moved to a newer
  # Node whose memory profile tipped this build over the container's RAM
  # limit (OOM / exit 137 at "Building server entrypoints").
  NODE_VERSION = "20"
  # Cap the V8 heap so Node garbage-collects aggressively and keeps its
  # resident memory under the container's physical RAM while bundling the
  # large Keystatic admin into the SSR function. Counter-intuitively a LOWER
  # cap fits better than a higher one: raising it lets RSS balloon until the
  # kernel OOM-kills the process.
  NODE_OPTIONS = "--max-old-space-size=4096"
