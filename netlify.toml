[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # The Astro build runs as a single Node process that, left uncapped, lazily
  # grabs ~14GB of heap on a large host and defers GC. On Netlify's smaller
  # build container that resident memory exceeds the physical RAM limit and the
  # kernel OOM-kills it (exit 137). Capping the V8 heap forces aggressive GC so
  # the build fits. A LOWER cap is safer here, not higher: raising it lets RSS
  # balloon until it's killed. Measured locally — the build completes cleanly
  # under a 2048MB cap, so this leaves headroom for the container's non-heap
  # overhead.
  NODE_OPTIONS = "--max-old-space-size=2048"
