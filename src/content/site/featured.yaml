name: FPGA Neural Network Accelerator
status: In progress
oneLiner: >-
  Developing an FPGA-based neural network accelerator on AMD Versal hardware
  using Vitis AI and HLS, running model inference at far lower power than a CPU
  or GPU. Mapping convolutional and Mamba sequence models in C++/HLS and
  Verilog, including Mamba's sequence-dependent selective scan. Targeting
  low-power edge applications such as building energy monitoring, as part of an
  honors thesis.
tech:
  - AMD Versal
  - Vitis AI
  - Vitis HLS
  - C++/HLS
  - Verilog
