name: SOQ 1
subtitle: Personal project · 2025
oneLiner: A Kinect-audio tracking system that estimates and targets a detected sound.
order: 1
mediaType: video
video: /videos/soq-1/video.mp4
tech:
  - C
  - Python
  - Qt
github: https://github.com/ofmohamm/soqv1
body:
  - >-
    Estimates left/right sound direction from the Kinect 360's four-microphone
    array and fuses it with absolute heading from a servo-mounted IMU to point
    at the source in real time. Controller firmware in C, signal processing and
    a live Qt visualizer in Python, with telemetry over UDP.
specs:
  - key: Input
    value: Kinect 360 4-mic array, servo-mounted IMU
  - key: Signal
    value: left/right audio direction fused with IMU heading
  - key: Stack
    value: C firmware, Python signal processing, Qt visualizer, UDP telemetry
