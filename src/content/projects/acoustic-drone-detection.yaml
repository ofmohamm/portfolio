body:
  - >-
    Drones are loud. Their rotors make a sound microphones can pick up, even
    when the drone isn't sending any signal and even when you can't see it. That
    makes sound a cheap, passive way to detect drones alongside radar and radio
    tracking. Our team is building a microphone array and a machine learning
    model that hears a drone, tells it apart from other noise, and shows where it
    is on a live display.
  - >-
    My focus is the machine learning. I'm training the models that detect and
    classify drones, then optimizing them to run fast. Speed matters here because
    the display is live. If the model is slow, the drone has already moved by the
    time the screen catches up.
