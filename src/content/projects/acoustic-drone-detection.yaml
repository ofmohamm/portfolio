body:
  - >-
    HII brought us this problem because small commercial drones have become a
    concern around fixed sites and vessels. Rotor noise gives a passive way to
    find them. A microphone doesn't need line of sight the way a camera or radar
    does. It doesn't need the drone to be transmitting the way RF detection
    does. It also gives away nothing about its own position, and it's cheap.
    Our system listens for a drone, classifies it by size, and reports which of
    four quadrants around the array it's in.
  - >-
    With one microphone you can tell a drone is nearby, but you can't tell where
    it is.
  - >-
    Two microphones give a direction. Sound reaches the nearer one first, and
    that delay gives the angle off the line joining them. A source at the
    mirrored angle on the other side of that line produces the same delay, so
    the pair can't tell which side the drone is on.
  - >-
    We use [five microphones]{.slate}, 72° apart on a ring with a 15 cm radius.
    Comparing delays across pairs gives a direction anywhere in the horizontal
    plane. A flat ring still has one ambiguity. A sound from 30° above the ring
    and the same sound from 30° below reach all five microphones at the same
    moments.
  - >-
    A [sixth microphone]{.ochre} sits on a center post 15 cm above the ring. It
    removes that ambiguity and gives the array its elevation estimate.
  - figure: mic-array
  - >-
    All six microphones have to be sampled on the same clock. The widest
    baseline is 28.5 cm, between two ring microphones 144° apart, so the longest
    delay we measure is about 832 µs. At 48 kHz one sample is 20.8 µs, which
    puts every delay we care about inside about 40 samples. A timing offset of a
    few samples between channels would be a large share of that range. The
    microphones are INMP441s, which output digital audio over I2S, and two can
    share one data line. A Teensy 4.1 reads all three data lines on one shared
    bit clock, so all six channels are sampled on the same edge. We still have
    to confirm the Teensy can capture all six at 48 kHz without dropping
    samples. If it can't, the fallback is four microphones on two data lines,
    which is still enough for quadrants.
  - >-
    The Teensy streams the audio to an NVIDIA Jetson Orin Nano Super over USB.
    The Jetson filters it to the band where rotor noise is strongest, splits it
    into 1 s windows, and turns each window into a spectrogram. A lightweight
    detector runs on every window. When it hears a rotor, a classifier assigns
    a size class and GCC-PHAT estimates the delays between microphone pairs. The
    delays become a direction, and the direction becomes a quadrant. A web
    dashboard shows the quadrant, class and confidence next to the ground-truth
    quadrant.
  - >-
    My part is the detection and classification models. The first baseline uses
    the public Al-Emadi drone audio dataset, with MFCC features going into a
    random forest. After that comes a small CNN on log-mel spectrograms,
    measured against the baseline. I split the data by recording session, not
    by clip. Clips cut from the same recording would otherwise land in both
    train and test and inflate the accuracy. The detector runs nonstop on the
    Jetson alongside localization, so I'm sizing the models to fit that budget.
    The target is 0.5 to 1.5 s from a rotor becoming audible to a result on
    screen.
  - >-
    Data is the hardest part. Labeled drone audio is scarce, and most public
    recordings are cleaner than our test room, which has HVAC and fans running.
    We combine public datasets with recordings captured on this array,
    including non-drone sounds from the rooms we test in. Then we augment them.
    We mix in background noise, change the gain to stand in for distance, and
    pitch-shift to stand in for rotor speeds we didn't record. Augmentation
    widens the dataset, but it can't replace real recordings.
  - >-
    The core goal is picking the correct quadrant. The test runs indoors, with
    a stationary drone or rotor within 2 m of the array and one decision per
    run. Our stretch goals are localization within ±15° in azimuth and
    elevation, and size classification at 80% accuracy or better. The array
    geometry already supports the finer localization, so it's a software
    change. In the best case, one sample of delay works out to about 1.4° in
    azimuth and 2.7° in elevation. Reverberation will make real accuracy worse
    than that. Classification works because different drone sizes use
    different rotors spinning at different speeds, which shows up as different
    blade-pass frequencies and harmonics. The small and medium drones in our
    budget are close in blade-pass frequency, though. If the model can't
    separate them, we'll merge them into one class and keep detection as the
    main goal.
  - >-
    [Owens Liu](https://www.linkedin.com/in/owens-liu/), [Logan
    Lewellen](https://www.linkedin.com/in/logan-lewellen-a0a1a6293/) and [Ryan
    Weiss](https://www.linkedin.com/in/ryanw-/) own the array hardware, capture
    firmware, localization pipeline and dashboard.
  - >-
    At the demo on April 10, 2027, a drone is placed in one of the four
    quadrants without the audience knowing which. The system makes its call
    live, and the dashboard shows it next to the right answer.
