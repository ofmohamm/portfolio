body:
  - >-
    A drone announces itself long before you can see it. Four rotors spinning at
    a few thousand rpm push air, and the air pushes back at frequencies a cheap
    microphone picks up from across a field. Radar needs line of sight. RF
    tracking needs the drone to be transmitting. Sound needs the drone to be
    flying, which is the one thing it can't stop doing. HII brought us this
    problem because small commercial drones have become a real concern around
    fixed sites and vessels, and a microphone costs a fraction of a radar while
    giving away nothing about its own position.
  - >-
    Start with one microphone. It tells you a drone is somewhere nearby, which
    is useful and nowhere near enough.
  - >-
    Add a second. Sound reaches the nearer microphone first, and that delay
    tells you which direction it came from. But the answer is only an angle off
    the line joining the two mics, so rotating the pair rotates the answer with
    it.
  - >-
    So we use [five]{.slate}, evenly spaced around a 15 cm ring. The delays between pairs
    now resolve a direction anywhere in the horizontal plane. The ring has a
    blind spot built into its geometry, though. A sound arriving from [30° above]{.teal}
    and the same sound arriving from [30° below]{.clay} hit all five microphones at
    exactly the same moments. A flat array can't tell them apart.
  - >-
    So a [sixth microphone]{.ochre} sits on a post, 15 cm above the ring. Breaking the
    symmetry breaks the ambiguity, and it costs one extra channel.
  - figure: mic-array
  - >-
    Here's the detail that's easy to miss and fatal to get wrong. The widest
    baseline across the ring is 28.5 cm, so the longest delay we ever need to
    measure is about 830 µs. At a 48 kHz sampling rate, one sample is 20.8 µs.
    The whole measurement lives inside roughly forty samples. If each microphone
    ran on its own clock, the drift between them would swamp the signal we're
    trying to read. So a Teensy 4.1 drives all six on one shared bit clock and
    captures every channel on the same edge. Any difference in arrival time is
    then the sound's path and nothing else.
  - >-
    The audio streams to an NVIDIA Jetson over USB. There, a lightweight
    detector runs continuously, because listening is cheap and the expensive
    work should only happen when there's something to look at. Once it hears a
    rotor, a classifier identifies the drone and GCC-PHAT compares arrival times
    across microphone pairs to produce a direction. A live dashboard shows the
    result.
  - >-
    **My focus is the models.** I train the detection and classification
    networks and tune them for inference speed, targeting 0.5 to 1.5 s from a
    rotor becoming audible to a result on the screen. The display is live, so a
    slow model reports where the drone was instead of where it is.
  - >-
    The hard part is the data. Labeled drone audio is scarce, and a model
    trained on clean public recordings won't survive a room with an HVAC unit
    running in it. We combine public datasets with our own recordings captured
    on this exact array, then augment with background noise, gain variation,
    and pitch shifts that stand in for the rotor speeds and distances we
    couldn't record ourselves.
  - >-
    Stretch goals. Beyond the baseline of placing a drone in the correct
    quadrant, we are going after localization within ±15° in both azimuth and
    elevation, and drone type classification at 80% accuracy or better. The
    classification case rests on physics: different drone sizes spin different
    rotors at different speeds, which leaves a distinct harmonic signature. The
    array geometry already supports the finer localization, so it is a software
    extension rather than a redesign.
  - >-
    Array hardware, capture firmware, localization pipeline, and dashboard are
    owned by [Owens Liu](https://www.linkedin.com/in/owens-liu/),
    [Logan Lewellen](https://www.linkedin.com/in/logan-lewellen-a0a1a6293/), and
    [Ryan Weiss](https://www.linkedin.com/in/ryanw-/).
  - Demo date is April 10, 2027.
