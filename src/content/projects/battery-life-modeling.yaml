body:
  - >-
    Datasheets tell you how much power a part should use. They don't tell you
    what it actually uses inside a real device. At Flox, I'm measuring those
    real numbers on a battery-powered edge AI camera. It wakes up when it senses
    motion, takes a picture, runs an AI model on the device, can trigger a
    deterrent, sends the result over cellular, and goes back to sleep. I'm
    measuring the power each part draws in every one of those states, so
    battery-life estimates come from bench data instead of datasheet values.
  - >-
    The part nobody measures is the switching. Every time a module changes
    modes, it uses energy, and no vendor publishes how much. I'm leading the
    bench work to measure those transitions across all five modules. That gives
    us a battery-life model for every event the camera handles, which will shape
    the next hardware revision and the firmware's power settings so the camera
    lasts longer between charges.
specs:
  - key: Platform
