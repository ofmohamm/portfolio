name: Privacy Based Tracker
subtitle: Personal project · 2026
oneLiner: >-
  A Kinect-audio tracker that finds and follows a sound source without
  recording or transmitting any audio.
status: past
order: 0
when: Mar – Apr 2026
mediaType: image
tech:
  - C
  - Python
  - Qt
  - Sensor fusion
github: https://github.com/ofmohamm/soqv1
body:
  - >-
    Quintin Hatzis, Sawyer Falkenbush and I built a tracker that points a servo
    at a sound source with no camera anywhere in the signal path.
  - >-
    A sound reaching two microphones hits the closer one first, and that delay
    tells you where it came from. We use the outer pair of the Kinect's four
    microphones, since a wider baseline means a bigger delay for the same
    angle. With a 22.6 cm baseline, sin(theta) = (tau * c) / d converts the
    delay into an angle. Zero degrees is straight ahead, negative is left,
    positive is right.
  - >-
    Measuring the delay is the hard part. Plain cross-correlation does not hold
    up in a normal room, since reflections get picked up as new sources.
    GCC-PHAT divides the cross-power spectrum by its own magnitude, which
    flattens every frequency to equal weight and sharpens the correlation peak.
    It also discards loudness, so only the phase relationship between the two
    microphones survives into the estimate. That is why the system can track
    someone without capturing what they said.
  - >-
    The estimate is coarser than we would like. At 16 kHz one sample of lag is
    62.5 µs, and across the 22.6 cm baseline the usable range is about 23
    discrete values, which works out to roughly 5.4 degrees per sample near
    straight ahead.
  - >-
    Most of the work is conditioning the input before the controller sees it. A
    300 to 3000 Hz bandpass covers speech and claps. An RMS energy gate skips
    quiet frames, so the system stops chasing the correlation of room noise
    when nobody is talking. The lag search is bounded to physically possible
    delays. A command only goes to the servo once three recent estimates agree
    within 15 degrees. A [PD loop]{.teal} on an Arduino closes it, Kp 0.06 and
    Kd 0.005 at 50 Hz, with the integral term at zero.
  - figure: pd-loop
  - >-
    A BNO055 on the same board reports absolute heading. The acoustic estimate
    is relative to wherever the array is currently facing, so adding heading
    gives a bearing in world coordinates for the visualizer. The same
    microcontroller drives the pan servo.
  - >-
    No audio is written to disk or sent off the machine. The only thing that
    leaves the loop is a bearing.
  - >-
    I owned the data processing pipeline and the dashboard. Direction-of-arrival
    runs in Python on the host rather than on the MCU, with the microcontroller
    driving the servo and streaming heading over UART.
  - >-
    A linear array cannot tell front from back. A source at +theta in front
    produces the same delays as one at +theta behind, so the geometry has to be
    known ahead of time.
