body:
  - >-
    A sensor node on a lab bench and a sensor node in a storm drain are
    different machines. The lab's units worked: a compute module, a FLIR Lepton
    thermal camera, a BNO055 IMU, a LoRaWAN radio, and power management, wired
    together on breakout boards with jumper leads. That assembly survives being
    carried across a room. It doesn't survive a season outdoors, where vibration
    walks connectors loose one millimeter at a time and water finds every gap
    you didn't design.
  - >-
    So the stack goes onto one board, inside a waterproof enclosure. I designed
    it.
  - >-
    **Why LoRaWAN over cellular.** Cellular is the obvious pick, right up until
    you look at where these nodes go. Deployment sites have no reliable
    coverage, and every node runs on a battery that has to last the whole
    deployment. LoRaWAN costs a small fraction of the power per packet and needs
    no carrier plan at all.
  - >-
    You pay for that in bandwidth, and the bill is steep: enough for telemetry,
    nowhere near enough for imagery. Which is why thermal data gets reduced on
    the node before anything is transmitted. The radio choice reaches back and
    changes what the firmware has to do, which is usually how radio choices
    work.
  - >-
    This was my first board. I taught myself KiCad and went from schematic to
    fabrication-ready Gerbers in a few weeks, including footprint verification
    and a DFM pass before release to fab, mentored by Dr. Elizabeth Carter and
    Manu Shergill.
