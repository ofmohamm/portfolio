body:
  - >-
    The CHaRTS lab needed flood monitoring nodes that could sit outdoors on a
    battery, with no network and no technician nearby. The existing units
    worked on a bench, but they were assembled from breakout boards and jumper
    wiring, which does not hold up in the field.
  - >-
    I designed a custom 2-layer PCB that put the stack on one board: a FLIR
    Lepton thermal camera, a BNO055 IMU, an mDot LoRaWAN radio and Witty Pi 4
    power management, inside a waterproof enclosure. Traces are 0.25 mm for
    signal and 0.5 mm for power.
  - >-
    We used LoRaWAN rather than cellular because the deployment sites have no
    reliable coverage and each node runs on a battery that has to last the
    deployment. LoRaWAN costs far less power per packet and needs no carrier
    plan. The tradeoff is bandwidth, which is enough for telemetry and not for
    imagery, so thermal data is reduced on the node before it is transmitted.
  - >-
    This was my first board. I taught myself KiCad and went from schematic to
    fabrication-ready Gerbers in a few weeks, including footprint verification
    and a DFM pass before release to fab. Dr. Elizabeth Carter and Manu
    Shergill mentored me through it.
